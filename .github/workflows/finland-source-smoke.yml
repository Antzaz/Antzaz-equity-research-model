name: Finland equity source smoke

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'agent/**'
    paths:
      - 'finland_sources.py'
      - 'source_registry.py'
      - 'issuer_source_engine.py'
      - 'model_reliability.py'
      - 'research_extensions.py'
      - 'update_model.py'
      - 'safe_update_model.py'
      - 'agent_research/source_health.py'
      - 'tests/test_finland_sources.py'
      - '.github/workflows/finland-source-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finland-source-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Finland source layer
        run: |
          python -m py_compile finland_sources.py source_registry.py issuer_source_engine.py model_reliability.py research_extensions.py update_model.py safe_update_model.py agent_research/source_health.py
      - name: Run Finland source contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_finland_sources.py
