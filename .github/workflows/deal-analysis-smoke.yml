name: Deal analysis smoke test

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'deal_analysis.py'
      - 'commodity_safe_runner.py'
      - 'equity_live_dashboard.py'
      - 'tests/test_deal_analysis.py'
      - '.github/workflows/deal-analysis-smoke.yml'
  pull_request:
    paths:
      - 'deal_analysis.py'
      - 'commodity_safe_runner.py'
      - 'equity_live_dashboard.py'
      - 'tests/test_deal_analysis.py'
      - '.github/workflows/deal-analysis-smoke.yml'

jobs:
  deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest openpyxl requests beautifulsoup4 lxml yfinance
      - name: Compile deal integration
        run: python -m py_compile deal_analysis.py commodity_safe_runner.py equity_live_dashboard.py
      - name: Run deterministic deal tests
        run: pytest -q tests/test_deal_analysis.py
