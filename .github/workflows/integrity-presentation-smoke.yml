name: Cross-sector integrity, coverage and workbook presentation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'agent/**'
    paths:
      - 'canonical_statement_guard.py'
      - 'public_data_backfill.py'
      - 'public_data_orchestrator.py'
      - 'ai_public_evidence.py'
      - 'ai_growth_research.py'
      - 'scenario_integrity.py'
      - 'workbook_presentation.py'
      - 'workbook_integrity_postprocess.py'
      - 'commodity_safe_runner.py'
      - 'research.py'
      - 'tests/test_integrity_presentation_backfill.py'
      - 'tests/test_ml_readability_quality.py'
      - '.github/workflows/integrity-presentation-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile new integrity layers
        run: |
          python -m py_compile canonical_statement_guard.py public_data_backfill.py public_data_orchestrator.py ai_public_evidence.py ai_growth_research.py scenario_integrity.py workbook_presentation.py workbook_integrity_postprocess.py commodity_safe_runner.py research.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_integrity_presentation_backfill.py tests/test_ml_readability_quality.py

  cross-sector-workbook:
    strategy:
      fail-fast: false
      matrix:
        ticker: [V, MSFT, JPM, CVX, TSM]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build guarded workbook
        env:
          SEC_USER_AGENT: 'Antzaz equity research CI test contact@example.com'
        run: python commodity_safe_runner.py ${{ matrix.ticker }}
      - name: Validate coverage, chart structure and consolidation
        env:
          TICKER: ${{ matrix.ticker }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from openpyxl import load_workbook

          ticker=os.environ['TICKER']
          path=sorted(Path('updated_models').glob(f'{ticker}_Equity_Research_*.xlsx'))[-1]
          wb=load_workbook(path,data_only=False,read_only=False)
          required={'Visual Dashboard','Investment Summary','Company Data','Historical Financials','Financial Statements','Three-Case Scenarios','Peer Comps','Data Quality'}
          assert required.issubset(wb.sheetnames), sorted(required-set(wb.sheetnames))
          assert wb.sheetnames[0]=='Visual Dashboard', wb.sheetnames[:8]
          if 'Dashboard' in wb.sheetnames:
              assert wb['Dashboard'].sheet_state=='hidden'
          if 'Comparative Analysis' in wb.sheetnames:
              assert wb['Comparative Analysis'].sheet_state=='hidden'
          if 'Score Audit Trail' in wb.sheetnames:
              assert wb['Score Audit Trail'].sheet_state=='hidden'

          dq=wb['Data Quality']
          checks={str(dq.cell(r,1).value or '').strip():str(dq.cell(r,2).value or '').strip() for r in range(1,dq.max_row+1)}
          for label in ('Public-data recovery coverage','Workbook presentation / consolidation','Canonical financial-statement reconciliation'):
              assert checks.get(label) in {'PASS','REVIEW'}, (label,checks.get(label))

          fs=wb['Financial Statements']
          # Core statement rows should have substantial numeric coverage after all public fallbacks.
          numeric=0; potential=0
          for r in range(1,fs.max_row+1):
              label=str(fs.cell(r,1).value or '').strip()
              if not label or label in {'Metric','Income Statement','Balance Sheet','Cash Flow Statement'}:
                  continue
              for c in range(2,min(fs.max_column,8)+1):
                  v=fs.cell(r,c).value
                  if isinstance(v,(int,float)): numeric+=1
                  if v not in (None,''): potential+=1
          assert numeric>=35, (ticker,numeric,potential)

          charts=[]
          for ws in wb.worksheets:
              for ch in getattr(ws,'_charts',[]) or []:
                  charts.append((ws.title,ch))
                  assert len(getattr(ch,'ser',[]) or [])>0, f'zero-series chart on {ws.title}'
          assert charts, 'workbook has no charts'

          broken=[]
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  for cell in row:
                      v=cell.value
                      if isinstance(v,str) and v.startswith('=') and '#REF!' in v:
                          broken.append(f'{ws.title}!{cell.coordinate}')
          assert not broken, broken[:20]

          print(ticker,'integrity/presentation PASS',path,'sheets',len(wb.sheetnames),'charts',len(charts),'numeric statement cells',numeric)
          PY
