name: ML agent loop smoke

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'machine_learning/short_horizon.py'
      - 'machine_learning/short_horizon_patch.py'
      - 'machine_learning/risk_forecasts.py'
      - 'machine_learning/research_loop.py'
      - 'machine_learning/learning_runner.py'
      - 'institutional_research/app.py'
      - 'institutional_research/pages/5_ML_Research_Lab.py'
      - 'institutional_research/src/ml_research_dashboard.py'
      - 'tests/test_short_horizon_research_loop.py'
      - 'tests/test_short_horizon_learning.py'
      - 'tests/test_ml_research_dashboard.py'
      - 'tests/test_streamlit_navigation.py'
      - '.github/workflows/ml-agent-loop-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile new ML modules and dashboard
        run: |
          python -m py_compile \
            machine_learning/short_horizon.py \
            machine_learning/short_horizon_patch.py \
            machine_learning/risk_forecasts.py \
            machine_learning/research_loop.py \
            machine_learning/learning_runner.py \
            institutional_research/src/ml_research_dashboard.py \
            institutional_research/pages/5_ML_Research_Lab.py \
            institutional_research/app.py
      - name: Run focused tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_short_horizon_research_loop.py
          tests/test_short_horizon_learning.py
          tests/test_continual_learning.py
          tests/test_ml_research_dashboard.py
          tests/test_streamlit_navigation.py
