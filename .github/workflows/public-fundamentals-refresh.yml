name: Public fundamentals refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '42 5 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-fundamentals-refresh.yml'
      - 'automation/build_public_fundamentals.py'
      - 'business_model_registry.py'
      - 'institutional_research/src/reverse_dcf.py'
      - 'institutional_research/src/__init__.py'
      - 'institutional_research/config.json'

permissions:
  contents: read

concurrency:
  group: public-fundamentals-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install lightweight market-data dependencies
        run: python -m pip install --disable-pip-version-check yfinance pandas numpy

      - name: Restore private portfolio universe
        env:
          PORTFOLIO_CSV_B64: ${{ secrets.PORTFOLIO_CSV_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get('PORTFOLIO_CSV_B64', '').strip()
          if not raw:
              raise SystemExit('Missing required Actions secret: PORTFOLIO_CSV_B64')
          path = Path('institutional_research/portfolio.csv')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(raw))
          print('Private portfolio universe restored.')
          PY

      - name: Build public fundamentals payload
        run: python automation/build_public_fundamentals.py

      # The public showcase intentionally excludes NVIDIA although the private
      # portfolio still holds it. Publishing private-universe aggregates or
      # fundamentals would silently restore a removed stock and invalid metrics.
      # The public repository's validated market refresh now owns all public
      # holdings, weights, fundamentals, performance and risk datasets.
      - name: Preserve curated public portfolio boundary
        run: echo "Public-only 14-holding refresh owns published market datasets; private holdings stay unchanged."

