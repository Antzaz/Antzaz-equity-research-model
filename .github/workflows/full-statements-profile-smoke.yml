name: Full statements, products and issuer segments smoke test

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'safe_update_model.py'
      - 'full_financial_statements.py'
      - 'full_financial_statements_v2.py'
      - 'full_financial_statements_v3.py'
      - 'verified_full_statement_adapters.py'
      - 'company_profile_v2.py'
      - 'financial_statement_integrity_v3.py'
      - 'financial_statement_integrity_v4.py'
      - 'segment_source_engine.py'
      - 'segment_source_enrichment.py'
      - 'segment_analysis_v2.py'
      - 'segment_chart_fix.py'
      - 'output_quality_v3.py'
      - '.github/workflows/full-statements-profile-smoke.yml'
  workflow_dispatch:

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        ticker: [CEG, GEV, CVX]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile statement, profile and segment layers
        run: |
          python -m py_compile safe_update_model.py full_financial_statements_v3.py verified_full_statement_adapters.py company_profile_v2.py output_quality_v3.py segment_source_engine.py segment_source_enrichment.py segment_analysis_v2.py segment_chart_fix.py
      - name: Build workbook
        env:
          SEC_USER_AGENT: ''
        run: python safe_update_model.py ${{ matrix.ticker }}
      - name: Validate full statements, products and issuer-first segments
        env:
          TICKER: ${{ matrix.ticker }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from openpyxl import load_workbook

          ticker=os.environ['TICKER']
          path=sorted(Path('updated_models').glob(f'{ticker}_Equity_Research_*.xlsx'))[-1]
          wb=load_workbook(path,data_only=False,read_only=False)
          assert {'Company Data','Financial Statements','Historical Financials','Data Quality','Score Audit Trail','Segment Analysis'}.issubset(wb.sheetnames)

          def find(ws,label):
              for r in range(1,ws.max_row+1):
                  if str(ws.cell(r,1).value or '').strip().lower()==label.lower(): return r
              return None
          def header_years(ws,section):
              s=find(ws,section); assert s, section
              h=next(r for r in range(s+1,min(ws.max_row+1,s+6)) if str(ws.cell(r,1).value or '').strip().lower()=='metric')
              return h,{int(ws.cell(h,c).value):c for c in range(2,min(ws.max_column,10)+1) if isinstance(ws.cell(h,c).value,(int,float)) and 1900<=int(ws.cell(h,c).value)<=2100}
          def section_count(ws,start_label,end_label):
              s=find(ws,start_label); e=find(ws,end_label) if end_label else ws.max_row+1
              h=next(r for r in range(s+1,min(e,s+6)) if str(ws.cell(r,1).value or '').strip().lower()=='metric')
              derived={'Operating Margin','Net Margin','Net Debt','Working Capital','Free Cash Flow','Efficiency Ratio (simple)','Credit Cost / Revenue','Loans / Deposits'}
              labels=[str(ws.cell(r,1).value or '').strip() for r in range(h+1,e)]
              return len([x for x in labels if x and x not in derived])

          cd=wb['Company Data']
          assert find(cd,'Business Overview & Main Products / Services') is not None
          ph=find(cd,'Business / Segment'); assert ph is not None
          products=[str(cd.cell(r,2).value or '').strip() for r in range(ph+1,min(cd.max_row,ph+10)+1)]
          products=[x for x in products if x]
          assert len(products)>=(1 if ticker=='CVX' else 5), products

          fs=wb['Financial Statements']
          assert 'Full Financial Statements' in str(fs['A1'].value)
          assert section_count(fs,'Income Statement','Balance Sheet')>=20
          assert section_count(fs,'Balance Sheet','Cash Flow Statement')>=35
          assert section_count(fs,'Cash Flow Statement','Full Statement Coverage')>=25

          ih,iy=header_years(fs,'Income Statement')
          bh,by=header_years(fs,'Balance Sheet')
          ch,cy=header_years(fs,'Cash Flow Statement')
          assert 2025 in iy and 2025 in by and 2025 in cy
          rev=find(fs,'Revenue'); op=find(fs,'Operating Income'); ni=find(fs,'Net Income')
          assert rev and op and ni

          if ticker=='CEG':
              assert abs(fs.cell(rev,iy[2025]).value-25.533)<.03
              assert abs(fs.cell(op,iy[2025]).value-3.086)<.03
              assert abs(fs.cell(ni,iy[2025]).value-2.319)<.03
              da=find(fs,'Depreciation, Amortization & Accretion'); ppe=find(fs,'Property & Equipment, Net')
              assert abs(fs.cell(da,cy[2025]).value-2.601)<.01, fs.cell(da,cy[2025]).value
              assert abs(fs.cell(ppe,by[2024]).value-21.671)<.01, fs.cell(ppe,by[2024]).value
          elif ticker=='GEV':
              assert abs(fs.cell(rev,iy[2025]).value-38.068)<.05, fs.cell(rev,iy[2025]).value
              assert abs(fs.cell(ni,iy[2025]).value-4.884)<.05, fs.cell(ni,iy[2025]).value
          elif ticker=='CVX':
              seg=wb['Segment Analysis']
              labels={str(seg.cell(r,1).value or '').strip() for r in range(1,seg.max_row+1)}
              assert {'Upstream','Downstream'}.issubset(labels), f'Chevron issuer-backed segment structure missing: {sorted(x for x in labels if x)[:30]}'
              issuer_links=[]
              for row in seg.iter_rows():
                  for cell in row:
                      target=getattr(getattr(cell,'hyperlink',None),'target',None)
                      if isinstance(target,str) and 'chevron.com' in target.lower(): issuer_links.append(target)
                      if isinstance(cell.value,str) and 'chevron.com' in cell.value.lower(): issuer_links.append(cell.value)
              assert issuer_links, 'Chevron Segment Analysis contains no Chevron-owned source link'
              note=str(seg['A3'].value or '').lower()
              assert 'issuer' in note or 'official-source' in note or 'official source' in note, note

          dq=wb['Data Quality']; checks={str(dq.cell(r,1).value or ''):str(dq.cell(r,2).value or '') for r in range(1,dq.max_row+1)}
          assert checks.get('Canonical financial-statement reconciliation') in {'PASS','REVIEW'}, checks.get('Canonical financial-statement reconciliation')
          assert checks.get('Full financial-statement depth') in {'PASS','REVIEW'}, checks.get('Full financial-statement depth')
          if ticker!='CVX': assert checks.get('Company product/profile coverage')=='PASS', checks.get('Company product/profile coverage')
          else: assert checks.get('Segment Analysis public-data coverage') in {'PASS','REVIEW'}, checks.get('Segment Analysis public-data coverage')
          assert checks.get('Score-engine single-source reconciliation')=='PASS'

          broken=[]
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  for cell in row:
                      v=cell.value
                      if isinstance(v,str) and v.startswith('=') and '#REF!' in v:
                          broken.append(f'{ws.title}!{cell.coordinate}')
          assert not broken, broken[:20]
          print(ticker,'full statements/profile/segment smoke PASS',path,'products',len(products))
          PY
