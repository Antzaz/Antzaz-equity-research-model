name: Machine learning research smoke test

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
    paths:
      - 'machine_learning/**'
      - 'ml_research.py'
      - 'ai_growth_research.py'
      - 'research.py'
      - 'tests/test_ml_models.py'
      - 'tests/test_ai_growth_engine.py'
      - 'tests/test_ml_history_depth.py'
      - 'requirements.txt'
      - '.github/workflows/ml-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'machine_learning/**'
      - 'ml_research.py'
      - 'ai_growth_research.py'
      - 'research.py'
      - 'tests/test_ml_models.py'
      - 'tests/test_ai_growth_engine.py'
      - 'tests/test_ml_history_depth.py'
      - 'requirements.txt'
      - '.github/workflows/ml-smoke.yml'
  workflow_dispatch:

jobs:
  ml-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile ML modules
        run: python -m compileall -q machine_learning ml_research.py ai_growth_research.py research.py tests/test_ml_models.py tests/test_ai_growth_engine.py tests/test_ml_history_depth.py
      - name: Run existing deterministic ML smoke test
        run: PYTHONPATH=. python tests/test_ml_models.py
      - name: Run AI growth engine tests
        run: PYTHONPATH=. python -m pytest -q tests/test_ai_growth_engine.py
      - name: Run deep history policy tests
        run: PYTHONPATH=. python -m pytest -q tests/test_ml_history_depth.py
      - name: Check CLI wiring
        run: |
          python ml_research.py --help
          python ai_growth_research.py --help
          python research.py --help | grep -- '--ml'
