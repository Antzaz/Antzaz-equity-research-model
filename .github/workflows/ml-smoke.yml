name: Machine learning research smoke test

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'machine_learning/**'
      - 'ml_research.py'
      - 'research.py'
      - 'tests/test_ml_models.py'
      - 'requirements.txt'
      - '.github/workflows/ml-smoke.yml'
  workflow_dispatch:

jobs:
  six-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile ML modules
        run: python -m compileall -q machine_learning ml_research.py research.py tests/test_ml_models.py
      - name: Run deterministic six-model smoke test
        run: PYTHONPATH=. python tests/test_ml_models.py
      - name: Check CLI wiring
        run: |
          python ml_research.py --help
          python research.py --help | grep -- '--ml'
