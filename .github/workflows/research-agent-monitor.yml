name: Frequent research-agent monitoring

on:
  schedule:
    # Rotate two privately configured holdings through all five research agents
    # every six hours; a 15-name portfolio is covered roughly every two days.
    - cron: '45 7 * * *'
    - cron: '45 1,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-agent-monitor.yml'
      - 'automation/verify_agent_runs.py'
      - 'agent_research/agents.py'
      - 'agent_research/source_health.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: private-agent-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyzipper pytest

      - name: Restore private monitoring universe
        env:
          PORTFOLIO_CSV_B64: ${{ secrets.PORTFOLIO_CSV_B64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = (os.environ.get("PORTFOLIO_CSV_B64") or "").strip()
          if not raw:
              raise SystemExit("PORTFOLIO_CSV_B64 is required for private agent monitoring")
          path = Path("institutional_research/portfolio.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(raw, validate=True))
          PY
          python automation/portfolio_universe.py institutional_research/portfolio.csv > "$RUNNER_TEMP/universe.txt"
          test -s "$RUNNER_TEMP/universe.txt"
          while IFS= read -r ticker; do
            [ -z "$ticker" ] && continue
            echo "::add-mask::$ticker"
          done < "$RUNNER_TEMP/universe.txt"

      - name: Select rotating batch without logging holdings
        run: |
          python - <<'PY'
          import math, os, time
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          names = list(dict.fromkeys(
              x.strip() for x in (root / "universe.txt").read_text(encoding="utf-8").splitlines() if x.strip()
          ))
          if not names:
              raise SystemExit("Private agent monitoring universe is empty")
          batch_size = 2
          groups = max(1, math.ceil(len(names) / batch_size))
          slot = int(time.time() // (6 * 3600)) % groups
          selection = names[slot * batch_size:(slot + 1) * batch_size]
          (root / "selected_tickers.txt").write_text("\n".join(selection) + "\n", encoding="utf-8")
          print(f"Selected {len(selection)} of {len(names)} private companies in rotating batch.")
          PY

      - name: Restore previous encrypted agent evidence
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_BUNDLE_PASSWORD: ${{ secrets.LIVE_BUNDLE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LIVE_BUNDLE_PASSWORD:-}" || { echo "LIVE_BUNDLE_PASSWORD is required"; exit 1; }
          mkdir -p "$RUNNER_TEMP/agent-restore"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=agent-monitor-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -n "$artifact_id" ]; then
            curl -L --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$RUNNER_TEMP/agent-state-artifact.zip"
            python - <<'PY'
          import os, zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(root / "agent-state-artifact.zip") as zf:
              zf.extractall(root / "agent-restore")
          PY
            python automation/ml_learning_state.py unpack \
              --input "$RUNNER_TEMP/agent-restore/agent-monitor-state.zip" \
              --destination .
          else
            echo "No previous encrypted agent state; initializing monitoring history."
          fi

      - name: Execute all five research agents for rotating batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SCHEDULE_SLOT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          failed=0
          count=0
          flags=(--no-ml --strict)
          # Limit paid LLM interpretation to one daily slot (or explicit manual runs).
          # Deterministic source/filing/KPI/thesis/QA monitoring still runs every six hours.
          if [ -n "${OPENAI_API_KEY:-}" ] && { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$SCHEDULE_SLOT" = "45 7 * * *" ]; }; then
            flags+=(--ai)
            echo "Evidence-bound AI interpretation enabled for the daily reasoning slot."
          else
            echo "Running deterministic monitoring; scheduled AI reasoning uses the daily 07:45 UTC slot when configured."
          fi
          while IFS= read -r ticker; do
            [ -z "$ticker" ] && continue
            count=$((count + 1))
            if python research.py "$ticker" "${flags[@]}" > "$RUNNER_TEMP/agent_run_${count}.log" 2>&1; then
              echo "Research-agent batch company ${count}: completed."
            else
              echo "::warning::Research-agent batch company ${count}: failed. Review privately via a local research run."
              failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/selected_tickers.txt"
          echo "Research-agent batch: ${count} selected, ${failed} failed."
          test "$failed" -eq 0

      - name: Verify agent output and preserve private summary
        run: |
          python automation/verify_agent_runs.py \
            --tickers-file "$RUNNER_TEMP/selected_tickers.txt" \
            --max-age-hours 4

      - name: Encrypt private agent history
        env:
          LIVE_BUNDLE_PASSWORD: ${{ secrets.LIVE_BUNDLE_PASSWORD }}
        run: |
          python automation/ml_learning_state.py pack \
            --source research_data \
            --output "$RUNNER_TEMP/agent-monitor-state.zip"

      - name: Persist encrypted agent history
        uses: actions/upload-artifact@v4
        with:
          name: agent-monitor-state
          path: ${{ runner.temp }}/agent-monitor-state.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
