name: Recruiter portfolio refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/recruiter-portfolio-refresh.yml'
      - 'automation/sync_portfolio_secret.ps1'
      - 'automation/sync_portfolio_thesis.py'
      - 'automation/build_showcase_snapshot.py'
      - 'automation/validate_showcase.py'
      - 'institutional_research/run_research.py'
      - 'institutional_research/config.json'
      - 'institutional_research/src/**'

permissions:
  contents: read

concurrency:
  group: recruiter-portfolio-refresh
  cancel-in-progress: true

jobs:
  refresh-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: institutional_research/requirements.txt

      - name: Install portfolio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r institutional_research/requirements.txt
          python -m pip install openpyxl

      - name: Restore private portfolio
        env:
          PORTFOLIO_CSV_B64: ${{ secrets.PORTFOLIO_CSV_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get('PORTFOLIO_CSV_B64', '').strip()
          if not raw:
              raise SystemExit('Missing required Actions secret: PORTFOLIO_CSV_B64')
          path = Path('institutional_research/portfolio.csv')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(raw))
          print('Private portfolio restored for recruiter refresh.')
          PY

      - name: Restore recruiter-safe thesis inputs
        env:
          PORTFOLIO_THESIS_JSON: ${{ secrets.PORTFOLIO_THESIS_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get('PORTFOLIO_THESIS_JSON', '').strip()
          data = json.loads(raw) if raw else {"version": 1, "portfolio_philosophy": {}, "company_theses": []}
          path = Path('institutional_research/portfolio_thesis_public.json')
          path.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          theses = data.get('company_theses', [])
          expected = sum(1 for x in theses if x.get('expected_annual_return') is not None)
          print(f'Recruiter thesis rows restored: {len(theses)}')
          print(f'Expected-return values restored: {expected}')
          PY

      - name: Sync validated read-only Global Macro Lab context
        run: |
          python automation/sync_macro_context.py || echo "::warning::Macro research context is unavailable; continuing without inferred regime."

      - name: Refresh portfolio analytics
        run: python institutional_research/run_research.py

      - name: Build and validate recruiter snapshot
        run: |
          python automation/build_showcase_snapshot.py
          python automation/validate_showcase.py

      # The public showcase intentionally excludes NVIDIA although the private
      # portfolio still holds it. Publishing private-universe aggregates or
      # fundamentals would silently restore a removed stock and invalid metrics.
      # The public repository's validated market refresh now owns all public
      # holdings, weights, fundamentals, performance and risk datasets.
      - name: Preserve curated public portfolio boundary
        run: echo "Public-only 14-holding refresh owns published market datasets; private holdings stay unchanged."

