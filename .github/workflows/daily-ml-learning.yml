name: Daily ML learning maintenance

on:
  schedule:
    # Four research-data checks daily. The 06:17 UTC slot also performs deep historical
    # backfill and macro refresh; other slots reuse the encrypted persistent database.
    - cron: '17 6 * * *'
    - cron: '17 0,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-ml-learning.yml'
      - 'automation/ml_learning_state.py'
      - 'automation/sec_preflight.py'
      - 'machine_learning/continual_learning.py'
      - 'machine_learning/short_horizon.py'
      - 'machine_learning/short_horizon_patch.py'
      - 'machine_learning/learning_runner.py'
      - 'machine_learning/__init__.py'
      - 'ml_history.py'
      - 'automation/check_ml_health.py'
      - 'tests/test_ml_learning_state.py'

permissions:
  contents: read
  actions: read

# Never let two hosted runners restore and overwrite independent copies of the same
# encrypted SQLite learning store.
concurrency:
  group: ml-learning-persistent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install learning dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyzipper

      - name: Validate SEC automated-access configuration
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * *' }}
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python automation/sec_preflight.py

      - name: Restore previous encrypted learning state
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_BUNDLE_PASSWORD: ${{ secrets.LIVE_BUNDLE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ml-learning-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No previous persistent learning artifact. This run will initialize one."
            exit 0
          fi
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/state-artifact.zip"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'state-artifact.zip'
          dst=Path(os.environ['RUNNER_TEMP'])/'restore'
          with zipfile.ZipFile(src) as zf:
              zf.extractall(dst)
          PY
          python automation/ml_learning_state.py unpack \
            --input "$RUNNER_TEMP/restore/ml-learning-state.zip" \
            --destination .
          python ml_history.py status

      - name: Validate state transport and learning source syntax
        run: |
          python -m py_compile automation/ml_learning_state.py machine_learning/learning_runner.py
          python -m pytest -q tests/test_ml_learning_state.py

      - name: Refresh market history and evaluate matured forecasts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SCHEDULE_SLOT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          flags=()
          # 06:17 UTC (or manual dispatch): full source maintenance.
          # Other slots: market data + point-in-time features only, avoiding unnecessary
          # SEC/FRED calls and monthly model retraining.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_SLOT" != "17 6 * * *" ]; then
            flags+=(--skip-deep --skip-macro)
          fi
          python ml_history.py daily-refresh \
            --universe sp500 \
            --limit 500 \
            --years 1 \
            --deep-years 20 \
            --deep-batch 25 "${flags[@]}"
          python automation/check_ml_health.py --max-age-days 7 --min-coverage 0.60
          python -m machine_learning.learning_runner

      - name: Restore private holdings for governed retraining
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * *' }}
        env:
          PORTFOLIO_CSV_B64: ${{ secrets.PORTFOLIO_CSV_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw=os.environ.get('PORTFOLIO_CSV_B64','').strip()
          if not raw:
              print('No private portfolio secret; monthly holding-level retraining will be skipped.')
              raise SystemExit(0)
          p=Path('institutional_research/portfolio.csv')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(base64.b64decode(raw))
          PY

      - name: Twice-monthly governed retraining
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SCHEDULE_SLOT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          day="$(TZ=Europe/Helsinki date +%d)"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && { { [ "$day" != "01" ] && [ "$day" != "15" ]; } || [ "${SCHEDULE_SLOT:-}" != "17 6 * * *" ]; }; then
            echo "Heavy retraining runs on the 1st and 15th at 06:17 UTC (or manual dispatch)."
            exit 0
          fi
          if [ ! -f institutional_research/portfolio.csv ]; then
            echo "No private portfolio file; skipping holding-level monthly retraining."
            exit 0
          fi
          python automation/portfolio_universe.py institutional_research/portfolio.csv > "$RUNNER_TEMP/tickers.txt"
          count=0
          failures=0
          while IFS= read -r ticker; do
            [ -z "$ticker" ] && continue
            echo "::add-mask::$ticker"
            count=$((count+1))
            if ! python research.py "$ticker" --no-ml > "$RUNNER_TEMP/research_${count}.log" 2>&1; then
              failures=$((failures+1))
              echo "::warning::Could not build the current research workbook for one holding; ML retraining for that holding was skipped."
              continue
            fi
            if ! python ml_research.py "$ticker" --no-workbook-write --no-auto-history > "$RUNNER_TEMP/ml_${count}.log" 2>&1; then
              failures=$((failures+1))
              echo "::warning::One holding-level ML retraining run failed."
            fi
          done < "$RUNNER_TEMP/tickers.txt"
          python -m machine_learning.learning_runner || true
          echo "Governed retraining: $count holding(s), $failures research/ML failure(s)."

      # Never publish the private portfolio's stock universe into the curated
      # public 15-name AMD showcase. Macro context has its own strict publisher.
      - name: Verify completed ML maintenance before persistence
        run: |
          python automation/check_ml_health.py --max-age-days 7 --min-coverage 0.60 | tee -a "$GITHUB_STEP_SUMMARY"
          python automation/ml_learning_state.py verify --source ml_data
          python -m py_compile automation/check_ml_health.py ml_history.py machine_learning/learning_runner.py

      - name: Encrypt updated learning state
        env:
          LIVE_BUNDLE_PASSWORD: ${{ secrets.LIVE_BUNDLE_PASSWORD }}
        run: |
          python automation/ml_learning_state.py pack \
            --source ml_data \
            --output "$RUNNER_TEMP/ml-learning-state.zip"

      - name: Upload persistent encrypted learning state
        uses: actions/upload-artifact@v4
        with:
          name: ml-learning-state
          path: ${{ runner.temp }}/ml-learning-state.zip
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
