name: Equity research smoke test

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - '.github/workflows/equity-smoke.yml'
      - 'update_model.py'
      - 'research.py'
      - 'agent_research/**'
      - 'source_registry.py'
      - 'institutional_lenses.py'
      - 'currency_normalization.py'
      - 'consensus_quality.py'
      - 'dynamic_peer_engine.py'
      - 'market_context.py'
      - 'research_extensions.py'
      - 'segment_source_engine.py'
      - 'ai_analysis.py'
  workflow_dispatch:

jobs:
  equity-smoke:
    strategy:
      fail-fast: false
      matrix:
        ticker: [TSM, GOOGL]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build research workbook
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python update_model.py ${{ matrix.ticker }}
      - name: Run no-token research agents
        run: python research.py ${{ matrix.ticker }} --skip-model
      - name: Validate consolidated workbook, expanded peers and institutional lenses
        env:
          TICKER: ${{ matrix.ticker }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from openpyxl import load_workbook
          from source_registry import issuer_sources

          ticker=os.environ['TICKER']
          files=sorted(Path('updated_models').glob(f'{ticker}_Equity_Research_*.xlsx'))
          assert files, f'{ticker} workbook was not generated'
          path=files[-1]
          wb=load_workbook(path,data_only=False,read_only=False)

          removed={
              'Visual Dashboard','Comparative Analysis','Valuation Cross-Checks','AI Analysis','AI Valuation',
              'Research Notes','Research Checklist','Research Journal','Data Dictionary'
          }
          survivors=removed.intersection(wb.sheetnames)
          assert not survivors, f'Duplicate/consolidated sheets still present: {sorted(survivors)}'
          for required in (
              'Leadership & Culture','Peer Comps','Expectations & Consensus','Dashboard','Data Quality',
              'Institutional Comparison','Research Workbench'
          ):
              assert required in wb.sheetnames, f'{required} sheet missing'

          # The consolidated people/leadership block must be idempotent, not appended repeatedly.
          dash=wb['Dashboard']
          people_titles=[r for r in range(1,dash.max_row+1) if str(dash.cell(r,1).value or '').strip()=='People, Leadership & Market Position']
          assert len(people_titles)==1, f'Dashboard people block duplicated: {people_titles}'
          p=people_titles[0]
          labels={str(dash.cell(r,1).value or '').strip():dash.cell(r,2).value for r in range(p+1,min(dash.max_row,p+12)+1)}
          assert 'Worker happiness / satisfaction signal' in labels, 'Worker happiness/status missing from Dashboard'
          assert 'Leadership evidence proxy / 100' in labels, 'Leadership proxy missing from Dashboard'
          assert 'Selected peer-set market value %' in labels, 'Peer-set market value percentage missing from Dashboard'
          assert 'Same-sector alternative screen' in labels, 'Alternative-company screen missing from Dashboard'

          people=wb['Leadership & Culture']
          leadership=people['B11'].value
          assert isinstance(leadership,(int,float)) and 0 <= leadership <= 100, f'Leadership proxy invalid: {leadership}'
          conclusion=people['B47'].value
          assert conclusion, 'Alternative-company research conclusion missing'

          peer=wb['Peer Comps']
          expected_headers={13:'Industry Market Share %',14:'Peer-Set Market Cap %',16:'Peer Type',17:'Data Coverage %',18:'Metric Source / Fallback Notes'}
          for col,header in expected_headers.items():
              assert peer.cell(3,col).value==header, f'Peer header {header!r} missing at column {col}'

          valid_peer_types={
              'Target classification','Direct business-model peer','Exact industry',
              'Strategic sector comp','Same-sector fallback'
          }
          peer_rows=[]
          for r in range(4,min(peer.max_row,30)+1):
              symbol=str(peer.cell(r,2).value or '').strip()
              peer_type=str(peer.cell(r,16).value or '').strip()
              if symbol and peer_type in valid_peer_types:
                  peer_rows.append(r)
          assert len(peer_rows)>=7, f'Expanded peer set too small: {len(peer_rows)} companies'
          assert len(peer_rows)<=10, f'Peer set unexpectedly large: {len(peer_rows)} companies'

          peer_weights=[]; coverage=[]
          for r in peer_rows:
              v=peer.cell(r,14).value
              if isinstance(v,(int,float)): peer_weights.append(v)
              cv=peer.cell(r,17).value
              if isinstance(cv,(int,float)): coverage.append(cv)
          assert len(peer_weights)>=5, 'Peer-set market-cap percentages not sufficiently populated'
          assert 0.98 <= sum(peer_weights) <= 1.02, f'Peer-set market-cap weights do not sum to ~100%: {sum(peer_weights)}'
          assert coverage and sum(coverage)/len(coverage)>=0.50, f'Peer metric coverage too low: {sum(coverage)/len(coverage) if coverage else None}'

          sources=issuer_sources(ticker)
          assert sources, f'Explicit issuer source registry missing for {ticker}'

          # Institutional comparison must contain exactly ten public-style investment lenses.
          inst=wb['Institutional Comparison']
          institutions=[str(inst.cell(r,1).value or '').strip() for r in range(11,21)]
          institutions=[x for x in institutions if x]
          assert len(institutions)==10, f'Expected 10 institutional lenses, got {len(institutions)}: {institutions}'
          expected_names=['Berkshire','Fundsmith','Dodge & Cox','Davis','Pershing','Baillie','Akre','Polen','Capital Group','T. Rowe']
          for name in expected_names:
              assert any(name.lower() in x.lower() for x in institutions), f'Missing institutional lens: {name}'
          assert all(inst.cell(r,8).value for r in range(11,21)), 'Institutional public-source links missing'

          if ticker=='TSM':
              hist=wb['Historical Financials']; latest_rev=hist['G4'].value
              assert isinstance(latest_rev,(int,float)) and 50 < latest_rev < 500, f'TSM latest revenue scale looks wrong: {latest_rev}'
              market_share=peer['M4'].value
              assert isinstance(market_share,(int,float)) and 0.60 < market_share < 0.80, f'TSM market share missing/wrong: {market_share}'
              share_rows=[r for r in peer_rows if isinstance(peer.cell(r,13).value,(int,float))]
              assert len(share_rows)>=4, f'TSM should have multiple comparable foundry market-share observations; got {len(share_rows)}'
              assert isinstance(people['B7'].value,(int,float)), 'TSM scope-limited employee signal not populated'
          else:
              # Alphabet has source-scoped business market positions, while broad employee happiness
              # remains REVIEW rather than a fabricated company-wide score.
              assert people['E7'].value=='REVIEW', f'GOOGL employee evidence should be REVIEW, got {people["E7"].value}'
              positions=[]
              for r in range(35,41):
                  metric=people.cell(r,1).value; share=people.cell(r,2).value
                  if metric and isinstance(share,(int,float)): positions.append((metric,share))
              assert positions, 'GOOGL business market-position snapshots missing'

          broken=[]
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  for cell in row:
                      value=cell.value
                      if isinstance(value,str) and value.startswith('='):
                          for name in removed:
                              if name in value: broken.append(f'{ws.title}!{cell.coordinate}->{name}')
          assert not broken, f'Formula references to removed sheets remain: {broken[:10]}'

          # Data Dictionary content should survive inside Data Quality after consolidation.
          dq=wb['Data Quality']
          dq_text=' '.join(str(dq.cell(r,c).value or '') for r in range(1,dq.max_row+1) for c in range(1,min(dq.max_column,4)+1))
          assert 'Historical Financials' in dq_text or 'Data Dictionary' in dq_text or 'Field' in dq_text, 'Data Dictionary content was not preserved in Data Quality'

          reports=list(Path('research_runs').glob(f'{ticker}/*/agent_report.md'))
          manifests=list(Path('research_runs').glob(f'{ticker}/*/source_health.json'))
          assert reports, 'No-token agent report was not generated'
          assert manifests, 'Source-health artifact was not generated'

          print(f'{ticker} smoke test PASS')
          print('Workbook:',path)
          print('Sheet count:',len(wb.sheetnames))
          print('Peer companies:',len(peer_rows))
          print('Average peer metric coverage:',sum(coverage)/len(coverage))
          print('Issuer sources:',len(sources))
          print('Leadership proxy:',leadership)
          print('Institutional lenses:',len(institutions))
          PY
