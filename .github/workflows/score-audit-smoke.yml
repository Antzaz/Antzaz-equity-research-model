name: Sector-aware score and Costco audit smoke test

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'score_engine_v2.py'
      - 'score_integration_v2.py'
      - 'financial_statement_repair_v2.py'
      - 'financial_statement_repair_final.py'
      - 'financial_statement_integrity_v3.py'
      - 'financial_statement_integrity_v4.py'
      - 'safe_update_model.py'
      - 'tests/test_score_engine_v2.py'
      - '.github/workflows/score-audit-smoke.yml'
  workflow_dispatch:

jobs:
  score-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile score layer
        run: python -m compileall -q score_engine_v2.py score_integration_v2.py financial_statement_repair_v2.py financial_statement_repair_final.py financial_statement_integrity_v3.py financial_statement_integrity_v4.py safe_update_model.py tests/test_score_engine_v2.py
      - name: Run Costco-like deterministic score regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/test_score_engine_v2.py

  cost-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build guarded Costco workbook
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python safe_update_model.py COST
      - name: Validate Costco fundamentals, scores and proof trail
        run: |
          python - <<'PY'
          import math
          from pathlib import Path
          import openpyxl

          files = sorted(Path('.').glob('COST_Equity_Research_CLEAN_v7*.xlsx'), key=lambda p: p.stat().st_mtime)
          assert files, 'Missing COST workbook'
          path = files[-1]
          wbv = openpyxl.load_workbook(path, data_only=True, read_only=False)
          assert 'Data Quality' in wbv.sheetnames
          assert 'Buffett Analysis' in wbv.sheetnames
          assert 'Dashboard' in wbv.sheetnames

          dq = wbv['Data Quality']
          facts = {}
          for r in range(1, dq.max_row + 1):
              field = dq.cell(r, 1).value
              value = dq.cell(r, 2).value
              if field is not None:
                  facts[str(field).strip()] = value

          sales = facts.get('FY25 Net Sales')
          op = facts.get('FY25 Operating Income')
          assert isinstance(sales, (int, float)) and sales > 200_000_000_000, sales
          assert isinstance(op, (int, float)) and op > 7_000_000_000, op

          b = wbv['Buffett Analysis']
          rows = {}
          for r in range(1, b.max_row + 1):
              key = b.cell(r, 1).value
              if key is not None:
                  rows[str(key).strip()] = r
          for key in ('Valuation Score','Growth Score','Balance Sheet Score','Overall Buffett Score','Overall Assessment'):
              assert key in rows, key

          for key in ('Valuation Score','Growth Score','Balance Sheet Score','Overall Buffett Score'):
              value = b.cell(rows[key], 2).value
              assert isinstance(value, (int, float)) and math.isfinite(float(value)), (key, value)

          overall = float(b.cell(rows['Overall Buffett Score'], 2).value)
          valuation = float(b.cell(rows['Valuation Score'], 2).value)
          growth = float(b.cell(rows['Growth Score'], 2).value)
          assert overall >= 35.0, overall
          assert growth >= 45.0, growth
          assert valuation <= 55.0, valuation

          dash = wbv['Dashboard']
          cells = [dash.cell(r, c).value for r in range(1, min(dash.max_row, 120) + 1) for c in range(1, min(dash.max_column, 14) + 1)]
          assert any(str(v).strip() == 'Model Score' for v in cells if v is not None)
          assert any(str(v).strip() == 'Buffett Quality Lens' for v in cells if v is not None)

          print({'workbook': str(path), 'sales': sales, 'operating_income': op, 'overall': overall, 'valuation': valuation, 'growth': growth})
          PY
