name: Daily private portfolio refresh

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Helsinki'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-portfolio-refresh.yml'
      - 'automation/ml_learning_state.py'
      - 'machine_learning/continual_learning.py'
      - 'ml_history.py'

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: institutional_research/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r institutional_research/requirements.txt
          python -m pip install openpyxl requests lxml beautifulsoup4 pypdf pyzipper

      - name: Restore encrypted persistent ML learning state
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_BUNDLE_PASSWORD: ${{ secrets.LIVE_BUNDLE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ml-learning-restore"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ml-learning-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No prior ML learning-state artifact found; starting a new persistent store."
            exit 0
          fi
          echo "Restoring prior encrypted ML learning state."
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$RUNNER_TEMP/ml-learning-artifact.zip"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'ml-learning-artifact.zip'
          dst=Path(os.environ['RUNNER_TEMP'])/'ml-learning-restore'
          with zipfile.ZipFile(src) as zf:
              zf.extractall(dst)
          PY
          archive="$RUNNER_TEMP/ml-learning-restore/ml-learning-state.zip"
          if [ ! -f "$archive" ]; then
            echo "Prior artifact did not contain ml-learning-state.zip"
            exit 1
          fi
          python automation/ml_learning_state.py unpack --input "$archive" --destination .
          python ml_history.py status

      - name: Daily maximum-data ML learning maintenance
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set +e
          python ml_history.py daily-refresh \
            --universe sp500 \
            --limit 500 \
            --years 1 \
            --deep-years 20 \
            --deep-batch 25
          refresh_code=$?
          python -m machine_learning.continual_learning
          learning_code=$?
          set -e
          if [ "$refresh_code" -ne 0 ]; then
            echo "Warning: daily history refresh had a provider/network failure. The previous persistent state remains usable."
          fi
          if [ "$learning_code" -ne 0 ]; then
            echo "Warning: continual-learning evaluation had a failure. Portfolio refresh will continue without inventing new evidence."
          fi

      - name: Restore private portfolio
        env:
          PORTFOLIO_CSV_B64: ${{ secrets.PORTFOLIO_CSV_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get('PORTFOLIO_CSV_B64', '').strip()
          if not raw:
              raise SystemExit('Missing required Actions secret: PORTFOLIO_CSV_B64')
          path = Path('institutional_research/portfolio.csv')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(raw))
          print('Private portfolio restored for this runner only.')
          PY

      - name: Restore recruiter-safe investment thesis inputs
        env:
          PORTFOLIO_THESIS_JSON: ${{ secrets.PORTFOLIO_THESIS_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get('PORTFOLIO_THESIS_JSON', '').strip()
          data = json.loads(raw) if raw else {"version": 1, "portfolio_philosophy": {}, "company_theses": []}
          path = Path('institutional_research/portfolio_thesis_public.json')
          path.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
          print(f"Recruiter thesis inputs restored: {len(data.get('company_theses', []))} company thesis row(s).")
          PY

      - name: Build and mask private research universe
        run: |
          python automation/portfolio_universe.py institutional_research/portfolio.csv > "$RUNNER_TEMP/portfolio_tickers.txt"
          count=0
          while IFS= read -r ticker; do
            [ -z "$ticker" ] && continue
            echo "::add-mask::$ticker"
            count=$((count + 1))
          done < "$RUNNER_TEMP/portfolio_tickers.txt"
          echo "Active portfolio companies: $count"

      - name: Refresh portfolio analytics
        run: |
          if python institutional_research/run_research.py > "$RUNNER_TEMP/portfolio_refresh.log" 2>&1; then
            echo "Portfolio analytics refreshed successfully."
          else
            echo "Portfolio analytics refresh failed."
            cat "$RUNNER_TEMP/portfolio_refresh.log"
            exit 1
          fi

      - name: Build and validate sanitized public portfolio snapshot
        run: |
          python automation/build_showcase_snapshot.py
          python automation/validate_showcase.py
          echo "Sanitized public snapshot built and validated from real aggregate portfolio analytics."

      - name: Publish sanitized snapshot to public showcase repository
        env:
          SHOWCASE_REPO_TOKEN: ${{ secrets.SHOWCASE_REPO_TOKEN }}
          SHOWCASE_REPOSITORY: ${{ vars.SHOWCASE_REPOSITORY }}
        run: |
          if [ -z "$SHOWCASE_REPO_TOKEN" ]; then
            echo "Missing required Actions secret: SHOWCASE_REPO_TOKEN"
            exit 1
          fi
          repo="${SHOWCASE_REPOSITORY:-Antzaz/Antzaz-investment-research-showcase}"
          dest="$RUNNER_TEMP/showcase-repo"
          git clone "https://x-access-token:${SHOWCASE_REPO_TOKEN}@github.com/${repo}.git" "$dest"
          mkdir -p "$dest/data"
          cp showcase/data/portfolio_snapshot.json "$dest/data/portfolio_snapshot.json"
          cd "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_snapshot.json
          if git diff --cached --quiet; then
            echo "Public showcase snapshot is already current."
          else
            git commit -m "Refresh sanitized portfolio analytics"
            git push origin HEAD:main
            echo "Public showcase snapshot refreshed."
          fi

      - name: Refresh equity models for portfolio companies only
        id: equity_refresh
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          failures=0
          index=0
          while IFS= read -r ticker; do
            [ -z "$ticker" ] && continue
            index=$((index + 1))
            log="$RUNNER_TEMP/equity_${index}.log"
            if python update_model.py "$ticker" > "$log" 2>&1; then
              echo "Company model $index refreshed."
            else
              failures=$((failures + 1))
              echo "Company model $index failed; sanitized log follows."
              cat "$log"
            fi
          done < "$RUNNER_TEMP/portfolio_tickers.txt"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          echo "Equity refresh complete: $index company model(s), $failures failure(s)."

      - name: Monthly governed ML retraining for portfolio companies
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          day="$(TZ=Europe/Helsinki date +%d)"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$day" != "01" ]; then
            echo "Not the monthly retraining date; daily learning/evaluation already completed."
            exit 0
          fi
          echo "Running monthly point-in-time ML retraining."
          failures=0
          index=0
          while IFS= read -r ticker; do
            [ -z "$ticker" ] && continue
            index=$((index + 1))
            log="$RUNNER_TEMP/ml_retrain_${index}.log"
            if python ml_research.py "$ticker" --no-workbook-write --no-auto-history > "$log" 2>&1; then
              echo "ML research model $index retrained."
            else
              failures=$((failures + 1))
              echo "ML research model $index retraining failed; sanitized log follows."
              cat "$log"
            fi
          done < "$RUNNER_TEMP/portfolio_tickers.txt"
          python -m machine_learning.continual_learning || true
          echo "Monthly ML retraining complete: $index company model(s), $failures failure(s)."

      - name: Re-run portfolio analytics after monthly ML retraining
        run: |
          day="$(TZ=Europe/Helsinki date +%d)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$day" = "01" ]; then
            python institutional_research/run_research.py > "$RUNNER_TEMP/portfolio_post_ml.log" 2>&1 || {
              echo "Post-ML portfolio analytics failed."
              cat "$RUNNER_TEMP/portfolio_post_ml.log"
              exit 1
            }
            echo "Portfolio analytics refreshed with the newly governed ML predictions."
          else
            echo "No monthly ML retraining today; post-ML rerun not needed."
          fi

      - name: Pack encrypted persistent ML learning state
        env:
          LIVE_BUNDLE_PASSWORD: ${{ secrets.LIVE_BUNDLE_PASSWORD }}
        run: |
          python automation/ml_learning_state.py pack \
            --source ml_data \
            --output "$RUNNER_TEMP/ml-learning-state.zip"

      - name: Upload encrypted ML learning state
        uses: actions/upload-artifact@v7
        with:
          name: ml-learning-state
          path: ${{ runner.temp }}/ml-learning-state.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Build encrypted private live-data bundle
        env:
          LIVE_BUNDLE_PASSWORD: ${{ secrets.LIVE_BUNDLE_PASSWORD }}
        run: |
          if [ -z "$LIVE_BUNDLE_PASSWORD" ]; then
            echo "Missing required Actions secret: LIVE_BUNDLE_PASSWORD"
            exit 1
          fi
          python automation/build_private_bundle.py \
            --portfolio institutional_research/portfolio.csv \
            --portfolio-outputs institutional_research/outputs/latest \
            --models-dir updated_models \
            --output "$RUNNER_TEMP/private-live-data.zip" \
            --password "$LIVE_BUNDLE_PASSWORD"

      - name: Upload encrypted live data
        uses: actions/upload-artifact@v7
        with:
          name: private-live-data
          path: ${{ runner.temp }}/private-live-data.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Report partial company failures
        if: steps.equity_refresh.outputs.failures != '0'
        run: |
          echo "Warning: one or more company models failed. The daily bundle still contains the refreshed portfolio analytics and every company model that completed successfully."
