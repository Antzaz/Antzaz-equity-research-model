name: Research bridge and ML state regression

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-contract-smoke.yml'
      - '.github/workflows/daily-ml-learning.yml'
      - 'automation/ml_learning_state.py'
      - 'automation/sync_macro_context.py'
      - 'institutional_research/src/macro_bridge.py'
      - 'institutional_research/run_research.py'
      - 'research.py'
      - 'tests/test_ml_learning_state.py'
      - 'tests/test_macro_bridge_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-and-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal test dependencies
        run: python -m pip install pyzipper pytest
      - name: Compile research connectors
        run: |
          python -m py_compile automation/ml_learning_state.py automation/sync_macro_context.py institutional_research/src/macro_bridge.py institutional_research/run_research.py research.py
      - name: Validate public bridge boundaries and encrypted ML database round-trip
        run: python -m pytest -q tests/test_macro_bridge_contract.py tests/test_ml_learning_state.py
