name: Python syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile equity research and portfolio modules
        run: |
          python -m py_compile \
            update_model.py \
            issuer_source_engine.py \
            model_reliability.py \
            dynamic_peer_engine.py \
            segment_analysis_v2.py \
            institutional_research/run_research.py \
            institutional_research/dashboard.py \
            institutional_research/pages/1_Alpha_Analysis.py \
            institutional_research/src/alpha_analysis.py \
            institutional_research/src/risk.py \
            institutional_research/src/professional_portfolio.py