name: Python repository audit

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  compile-and-static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile every Python module
        run: python -m compileall -q .
      - name: Install critical static checker
        run: python -m pip install --disable-pip-version-check ruff
      - name: Check syntax and high-confidence Python errors
        run: ruff check . --select E9,F63,F7,F82
