name: Commodity valuation smoke test

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'commodity_valuation.py'
      - 'commodity_valuation_v2.py'
      - 'commodity_valuation_v3.py'
      - 'commodity_safe_runner.py'
      - 'safe_update_model.py'
      - 'research.py'
      - 'tests/test_commodity_valuation.py'
      - '.github/workflows/commodity-valuation-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'commodity_valuation.py'
      - 'commodity_valuation_v2.py'
      - 'commodity_valuation_v3.py'
      - 'commodity_safe_runner.py'
      - 'safe_update_model.py'
      - 'research.py'
      - 'tests/test_commodity_valuation.py'
      - '.github/workflows/commodity-valuation-smoke.yml'
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and run deterministic regression
        run: |
          python -m py_compile commodity_valuation.py commodity_valuation_v2.py commodity_valuation_v3.py commodity_safe_runner.py safe_update_model.py research.py tests/test_commodity_valuation.py
          PYTHONPATH=. python tests/test_commodity_valuation.py

  live-cvx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build live Chevron workbook
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python commodity_safe_runner.py CVX
      - name: Validate normalized valuation
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          from advanced_analytics_v2 import _base_value as operating_value
          from commodity_valuation_v3 import commodity_base_value, equity_fcf_value

          path=sorted(Path('updated_models').glob('CVX_Equity_Research_*.xlsx'))[-1]
          wb=load_workbook(path,data_only=False,read_only=False)
          assert 'Commodity Valuation' in wb.sheetnames
          assert 'Decision View' in wb.sheetnames
          sc=wb['Three-Case Scenarios']
          operating=float(operating_value(wb))
          direct=float(equity_fcf_value(wb,'base'))
          primary=float(commodity_base_value(wb))
          price=float(wb['Company Data']['B8'].value)

          assert float(sc['C6'].value)>=0.0799, sc['C6'].value
          assert abs(float(sc['C7'].value)-0.015)<1e-8, sc['C7'].value
          assert abs(float(sc['N12'].value)-0.15)<1e-8, sc['N12'].value
          assert abs(float(sc['O12'].value)+0.08)<1e-8, sc['O12'].value
          assert float(sc['W12'].value)<=0.0201, sc['W12'].value
          assert float(sc['N14'].value)<0.19, sc['N14'].value

          # No repeat of the old ~$779 / +294% false signal.
          assert 75<operating<400, operating
          assert 100<direct<350, direct
          assert 90<primary<325, primary
          assert primary/price-1<0.75, (primary,price)

          cv=wb['Commodity Valuation']
          text=' '.join(str(cv.cell(r,c).value or '') for r in range(1,cv.max_row+1) for c in range(1,min(8,cv.max_column)+1))
          assert 'Normalized Brent' in text
          assert 'Calculated CAPM/WACC before overlay' in text
          assert 'Authoritative Commodity Valuation' in text
          assert 'Normalized Equity FCF DCF' in text
          assert 'No net-debt subtraction' in text

          dv=wb['Decision View']
          labels={str(dv.cell(r,1).value or '').strip():r for r in range(1,dv.max_row+1)}
          assert 'Commodity Triangulated Fair Value' in labels, labels.keys()
          saved_primary=float(dv.cell(labels['Commodity Triangulated Fair Value'],2).value)
          assert abs(saved_primary-primary)<max(1.0,abs(primary)*.01), (saved_primary,primary)

          dq=wb['Data Quality']
          q={str(dq.cell(r,1).value or '').strip():str(dq.cell(r,2).value or '').strip() for r in range(1,dq.max_row+1)}
          assert q.get('Commodity valuation triangulation') in {'PASS','REVIEW'}, q.get('Commodity valuation triangulation')

          broken=[]
          for ws in wb.worksheets:
              for row in ws.iter_rows():
                  for cell in row:
                      if isinstance(cell.value,str) and cell.value.startswith('=') and '#REF!' in cell.value:
                          broken.append(f'{ws.title}!{cell.coordinate}')
          assert not broken, broken[:20]
          print('LIVE CVX COMMODITY V3 PASS',path,'price',price,'operating',operating,'equity_fcf',direct,'primary',primary,'upside',primary/price-1,'wacc',sc['C6'].value,'tgr',sc['C7'].value)
          PY

  non-commodity-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build Google control workbook
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python commodity_safe_runner.py GOOGL
      - name: Ensure commodity overlay stays isolated
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook
          path=sorted(Path('updated_models').glob('GOOGL_Equity_Research_*.xlsx'))[-1]
          wb=load_workbook(path,data_only=False,read_only=False)
          assert 'Commodity Valuation' not in wb.sheetnames
          print('GOOGL NON-COMMODITY CONTROL PASS')
          PY
